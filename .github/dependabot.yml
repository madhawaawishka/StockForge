version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Spring Boot manages most versions; upgrade the platform as one unit.
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
      build-and-test-tools:
        patterns:
          - "com.diffplug.spotless:*"
          - "com.palantir.javaformat:*"
          - "org.jacoco:*"
          - "com.tngtech.archunit:*"
          - "org.springdoc:*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
