name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repository unless they say otherwise.
permissions:
  contents: read

# A newer push to the same branch makes older runs pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history, not only the latest commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate Docker Compose file
        run: docker compose config --quiet

      # verify = compile (warnings are errors) + unit tests + Testcontainers integration tests
      #          + Spotless format check + JaCoCo coverage report
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            services/*/target/surefire-reports/
            services/*/target/failsafe-reports/
            services/*/target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore
