syntax = "proto3";

package stockforge.order.v1;

option java_multiple_files = true;
option java_package = "com.stockforge.order.v1";

// Internal gRPC contract for the Order Service (spec §12, §16, §23).
service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder (GetOrderRequest) returns (GetOrderResponse);
  rpc CancelOrder (CancelOrderRequest) returns (CancelOrderResponse);
  rpc ListOrders (ListOrdersRequest) returns (ListOrdersResponse);
}

message CreateOrderRequest {
  string reservation_id = 1;
  string user_id = 2;
  string idempotency_key = 3;
}

message CreateOrderResponse {
  string order_id = 1;
  string reservation_id = 2;
  string user_id = 3;
  string status = 4;
  string total_amount = 5;
  string currency = 6;
  string created_at = 7;
}

message GetOrderRequest {
  string order_id = 1;
  string user_id = 2;
}

message OrderItemDto {
  string product_id = 1;
  int32 quantity = 2;
  string unit_price = 3;
  string currency = 4;
}

message OrderStatusHistoryDto {
  string from_status = 1;
  string to_status = 2;
  string reason = 3;
  string occurred_at = 4;
}

message GetOrderResponse {
  string order_id = 1;
  string reservation_id = 2;
  string user_id = 3;
  string status = 4;
  string total_amount = 5;
  string currency = 6;
  repeated OrderItemDto items = 7;
  repeated OrderStatusHistoryDto history = 8;
  string created_at = 9;
  string updated_at = 10;
}

message CancelOrderRequest {
  string order_id = 1;
  string user_id = 2;
  string reason = 3;
}

message CancelOrderResponse {
  string order_id = 1;
  string status = 2;
}

message ListOrdersRequest {
  string user_id = 1;
  int32 limit = 2;
}

message ListOrdersResponse {
  repeated GetOrderResponse orders = 1;
}

