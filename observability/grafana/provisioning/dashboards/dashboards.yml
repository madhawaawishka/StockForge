# Mounted into grafana/otel-lgtm at /otel-lgtm/grafana/conf/provisioning/dashboards/stockforge.yaml.
# Dashboards query the image's bundled data sources by uid (prometheus, tempo, loki), so none are provisioned here.
apiVersion: 1

providers:
  - name: StockForge
    orgId: 1
    folder: StockForge
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /otel-lgtm/stockforge-dashboards
