server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 50ms
  security:
    oauth2:
      resourceserver:
        jwt:
          secret: ${JWT_SECRET:default-secret-key-for-development-must-be-32-bytes!}

stockforge:
  grpc:
    inventory-host: ${INVENTORY_GRPC_HOST:localhost}
    inventory-port: ${INVENTORY_GRPC_PORT:9091}
    order-host: ${ORDER_GRPC_HOST:localhost}
    order-port: ${ORDER_GRPC_PORT:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
