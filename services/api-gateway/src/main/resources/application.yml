server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 50ms
  security:
    oauth2:
      resourceserver:
        jwt:
          secret: ${JWT_SECRET:default-secret-key-for-development-must-be-32-bytes!}

stockforge:
  grpc:
    inventory-host: ${INVENTORY_GRPC_HOST:localhost}
    inventory-port: ${INVENTORY_GRPC_PORT:9091}
    order-host: ${ORDER_GRPC_HOST:localhost}
    order-port: ${ORDER_GRPC_PORT:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

resilience4j:
  circuitbreaker:
    instances:
      inventoryService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        register-health-indicator: true
      orderService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        register-health-indicator: true
  bulkhead:
    instances:
      inventoryService:
        max-concurrent-calls: 100
        max-wait-duration: 0ms
      orderService:
        max-concurrent-calls: 100
        max-wait-duration: 0ms
