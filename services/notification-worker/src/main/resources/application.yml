# Notification Worker application configuration (spec §10, §18)
spring:
  application:
    name: notification-worker
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/stockforge}
    username: ${NOTIFICATION_DB_USERNAME:notification_svc}
    password: ${NOTIFICATION_DB_PASSWORD:notification_local_only}
    hikari:
      pool-name: notification-db
      maximum-pool-size: ${NOTIFICATION_DB_POOL_SIZE:5}
      minimum-idle: ${NOTIFICATION_DB_POOL_SIZE:5}
      connection-timeout: 3000
      schema: notification
      data-source-properties:
        options: "-c statement_timeout=5000 -c lock_timeout=2000 -c idle_in_transaction_session_timeout=10000"
  flyway:
    schemas: notification
    default-schema: notification
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      retries: 3
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${NOTIFICATION_HTTP_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  info:
    build:
      enabled: true

logging:
  structured:
    format:
      console: ecs
