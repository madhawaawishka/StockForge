# Order Service application configuration (spec §10, §16, §24)
spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL}
    username: ${ORDER_DB_USERNAME}
    password: ${ORDER_DB_PASSWORD}
    hikari:
      pool-name: order-db
      maximum-pool-size: ${ORDER_DB_POOL_SIZE:10}
      minimum-idle: ${ORDER_DB_POOL_SIZE:10}
      connection-timeout: 3000
      schema: ordering
      data-source-properties:
        options: "-c statement_timeout=5000 -c lock_timeout=2000 -c idle_in_transaction_session_timeout=10000"
  flyway:
    schemas: ordering
    default-schema: ordering
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      retries: 3
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${ORDER_HTTP_PORT:8082}

order:
  grpc:
    port: ${ORDER_GRPC_PORT:9091}
    enabled: ${ORDER_GRPC_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  info:
    build:
      enabled: true

logging:
  structured:
    format:
      console: ecs
