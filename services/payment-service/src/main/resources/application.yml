# Payment Service application configuration (spec §10, §16, §24)
spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/stockforge}
    username: ${PAYMENT_DB_USERNAME:payment_svc}
    password: ${PAYMENT_DB_PASSWORD:payment_local_only}
    hikari:
      pool-name: payment-db
      maximum-pool-size: ${PAYMENT_DB_POOL_SIZE:10}
      minimum-idle: ${PAYMENT_DB_POOL_SIZE:10}
      connection-timeout: 3000
      schema: payment
      data-source-properties:
        options: "-c statement_timeout=5000 -c lock_timeout=2000 -c idle_in_transaction_session_timeout=10000"
  flyway:
    schemas: payment
    default-schema: payment
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      retries: 3
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${PAYMENT_HTTP_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  info:
    build:
      enabled: true

logging:
  structured:
    format:
      console: ecs
